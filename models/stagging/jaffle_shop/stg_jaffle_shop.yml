version: 2

models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - return_pending
                  - placed
      - name: customer_id
        tests:
          - relationships:
              arguments:
                field: customer_id
                to: ref('stg_jaffle_shop__customers')
  - name: students
    description: "stagging model for students"
    columns:
      - name: student_id
        tests:
          - unique
          - not_null
      - name: student_name
        tests:
          - unique
          - not_null
      - name: branch_name
        tests:
          - accepted_values:
              arguments:
                values:
                  - MECH
                  - CSE
                  - ECE
                  - IT
                  - CIVIL
                  - EEE